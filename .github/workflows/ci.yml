name: CI

# Every push to main and every pull request runs the tests.
# Pushing a tag like v0.2.0 also builds the app, packages it as a DMG and
# publishes it on a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: Scripts/test.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write # create the release and upload the DMG
    steps:
      - uses: actions/checkout@v5

      - name: Stamp version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build app
        run: Scripts/build-app.sh

      - name: Build DMG
        run: Scripts/make-dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/BallScroll-$VERSION.dmg" \
            --title "BallScroll $VERSION" \
            --generate-notes
